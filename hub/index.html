<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Isabela Weekly Message Hub — internal CRM dispatch hub for weekly wellness campaigns." />
  <title>Isabela Weekly Message Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/dashboard">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">Isabela<small>Weekly Message Hub</small></span>
      </a>
      <nav class="topnav" id="nav" aria-label="Sections"></nav>
      <div class="topbar__right">
        <span class="pill pill--ok" id="connState">Mock data</span>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle__dot"></span><span id="themeLabel">Light</span>
        </button>
        <span class="avatar" title="Signed in">IS</span>
      </div>
    </header>
    <main class="screen" id="screen" tabindex="-1"></main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
